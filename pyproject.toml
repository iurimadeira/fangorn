[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[project]
name = "fangorn-cli"
version = "0.1.0"
description = "Worktree-native workspace families for humans and agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Iuri Madeira" }]
dependencies = ["click>=8.1.8,<9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
fangorn = "fangorn.cli:main"

[project.urls]
Homepage = "https://github.com/iurimadeira/fangorn"
Issues = "https://github.com/iurimadeira/fangorn/issues"

[dependency-groups]
dev = [
  "coverage>=7.10,<8",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.uv.build-backend]
module-name = "fangorn"
source-include = [".github/**", "scripts/**", "tests/**", "uv.lock"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
warn_unreachable = true

[tool.coverage.run]
branch = true
data_file = ".coverage-data/.coverage"
parallel = true
patch = ["subprocess"]
relative_files = true
source = ["src", "scripts"]
