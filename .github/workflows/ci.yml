name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src scripts tests
      - name: Test with branch and subprocess coverage
        run: |
          uv run coverage erase
          uv run coverage run --branch -m pytest
          uv run coverage combine
          uv run coverage report --fail-under=85.0
      - name: Build wheel and source distribution
        run: uv build
      - name: Check license and privacy
        run: uv run python scripts/check_publication.py --source . dist/*
      - name: Smoke-test installed wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl fangorn --help
          uv run --isolated --no-project --with dist/*.whl fangorn --version
          repository="$(mktemp -d)"
          git init --initial-branch=main "$repository"
          git -c user.name=Fangorn -c user.email=fangorn@example.invalid -C "$repository" commit --allow-empty -m initial
          XDG_DATA_HOME="$(mktemp -d)" XDG_STATE_HOME="$(mktemp -d)" uv run --isolated --no-project --with dist/*.whl fangorn workspace create --repo "$repository" --branch wheel-smoke --path "$repository-worktree" --headless --json
      - name: Smoke-test installed source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz fangorn --help
          uv run --isolated --no-project --with dist/*.tar.gz fangorn --version
          repository="$(mktemp -d)"
          git init --initial-branch=main "$repository"
          git -c user.name=Fangorn -c user.email=fangorn@example.invalid -C "$repository" commit --allow-empty -m initial
          XDG_DATA_HOME="$(mktemp -d)" XDG_STATE_HOME="$(mktemp -d)" uv run --isolated --no-project --with dist/*.tar.gz fangorn workspace create --repo "$repository" --branch sdist-smoke --path "$repository-worktree" --headless --json

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Test
        run: uv run pytest

  ci:
    name: CI
    needs: [quality, compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm required jobs succeeded
        run: |
          [[ "${{ needs.quality.result }}" == 'success' ]]
          [[ "${{ needs.compatibility.result }}" == 'success' ]]
