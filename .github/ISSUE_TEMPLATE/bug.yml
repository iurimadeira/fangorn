name: Bug report
description: Report a reproducible Fangorn defect without sensitive data
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        Security reports do not belong in public Issues. Use the
        [confidential reporting form](https://github.com/iurimadeira/fangorn/security/advisories/new)
        instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest reproducible steps with sanitized paths, names, and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only the relevant sanitized error excerpt, never a raw log bundle or complete environment dump.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux / Python 3.12
        - Linux / Python 3.13
        - Linux / Python 3.14
        - macOS / Python 3.12
        - macOS / Python 3.13
        - macOS / Python 3.14
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, private paths, and private infrastructure details.
          required: true
